name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    name: Estilo, esquema y pruebas
    runs-on: ubuntu-latest

    # MariaDB 10.11 LTS: la misma version que se acordó como objetivo de
    # produccion, para que el esquema se pruebe sobre el motor real.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ganaderia_saas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ganaderia_saas_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # gd (QR) y zip (Excel) son obligatorios: son dependencias reales
          # del proyecto, no opcionales.
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath, curl, fileinfo, dom, xml
          coverage: none

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Cache de Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Entorno de la aplicacion
        run: |
          cp .env.example .env
          php artisan key:generate

      # Las vistas usan @vite, asi que sin manifiesto compilado fallarian al
      # renderizar. Se compila igual que en produccion.
      - name: Dependencias y build del frontend
        run: |
          npm ci
          npm run build

      - name: Estilo de codigo (Pint)
        run: vendor/bin/pint --test

      - name: Analisis estatico (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Esquema reproducible
        run: php artisan migrate:fresh --seed --force

      - name: Pruebas
        run: php artisan test

      # El analisis estatico esta en verde a nivel 5. Si se sube el nivel, hay
      # que corregir lo que salga antes de subirlo aqui.
